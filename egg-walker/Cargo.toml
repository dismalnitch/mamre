[package]
name = "mamre-egg-walker"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "An event-graph CRDT after Eg-walker: edits are plain positions, merging replays only what's concurrent, and it works on sequences of any item"
keywords = ["crdt", "eg-walker", "collaboration", "sequence", "event-graph"]
repository = "https://github.com/dismalnitch/mamre"
publish = false

[dependencies]
mamre = { path = ".." }

[dev-dependencies]
proptest = "1.12"
# The reference implementation of the paper: an independent oracle.
diamond-types = "1.0.0"
# A real document for the benchmarks to apply changes to.
mamre-rope = { path = "../rope" }

# Benchmarks on the Eg-walker paper's editing traces: fetch them first with
# benchmark_data/fetch.sh.
[[bench]]
name = "traces"
harness = false

# What moves cost: a synthetic book, against the same with no moves.
[[bench]]
name = "moves"
harness = false
