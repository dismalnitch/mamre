[package]
name = "mamre-egg-walker"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "An event-graph CRDT after Eg-walker: edits are plain positions, merging replays only what's concurrent, and it works on sequences of any item"
keywords = ["crdt", "eg-walker", "collaboration", "sequence", "event-graph"]
repository = "https://github.com/dismalnitch/mamre"
publish = false

[features]
# For timing when speed is the focus, not correctness: debug builds skip
# their slow self-checks (the fast window run beside the simple walk's,
# step by step, and the layouts it checks against a drawing). Release
# builds never run them anyway.
perf = []
# Range moves with identity (#20): research, off the path to shipping since
# #68 (a move is a delete and a paste of what it deleted). The engine
# still reads them, from older histories; their own tests (moves, copies,
# undo_moves), which keep finding divergences (#61), run only with this.
range-moves = []

[dependencies]
mamre = { path = ".." }
# Side data (ranges, comments, undo steps, the history index) is written as
# JSON, beside the core log's own bytes: see `ext.rs`.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
proptest = "1.12"
# The reference implementation of the paper: an independent oracle.
diamond-types = "1.0.0"
# A real document for the benchmarks to apply changes to.
mamre-rope = { path = "../rope" }

# Benchmarks on the Eg-walker paper's editing traces: fetch them first with
# benchmark_data/fetch.sh.
[[bench]]
name = "traces"
harness = false

# What moves cost: a synthetic book, against the same with no moves.
[[bench]]
name = "moves"
harness = false
