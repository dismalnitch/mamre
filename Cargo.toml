[package]
name = "mamre"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A sum tree: a B+ tree that keeps running totals, and can be a Merkle tree too"
repository = "https://github.com/dismalnitch/mamre"
publish = false

# The tree is this root package; mixins built on its public API are members.
[workspace]
members = ["rope", "diamond", "egg-walker", "text"]

[dev-dependencies]
proptest = "1.12"

[dependencies]
arrayvec = "0.7.8"

# The property tests check every operation against slow models; unoptimized,
# they take minutes. Debug assertions and overflow checks stay on.
[profile.test]
opt-level = 1
