[package]
name = "mamre-rope"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A text rope on mamre's sum tree: chunks of text, summed by bytes, chars, lines, words, paragraphs and sections, with grapheme cluster boundaries"
repository = "https://github.com/dismalnitch/mamre"
publish = false

[dependencies]
mamre = { path = ".." }
arrayvec = "0.7.8"
# Grapheme cluster boundaries, found chunk by chunk.
unicode-segmentation = "1.12"
# Which chars are marks, for words that keep their vowel points.
unicode-properties = { version = "0.1.5", default-features = false, features = ["general-category"] }

[dev-dependencies]
proptest = "1.12"
unicode-segmentation = "1.12"

[[bench]]
name = "edits"
harness = false

[[bench]]
name = "sections"
harness = false
